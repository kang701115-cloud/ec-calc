<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>양액 계산기</title>

<style>
:root{--brand:#007BFF}
body{font-family:Arial;background:#f7f8fa;margin:0;padding:20px;text-align:center}
.card{background:#fff;padding:20px;margin:16px auto;border-radius:14px;max-width:760px}
input{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #ccc}
button{margin-top:12px;padding:12px;width:100%;background:var(--brand);color:#fff;border:none;border-radius:8px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border:1px solid #eee;padding:8px}
.hidden{display:none}
.switch{cursor:pointer}
</style>
</head>

<body>

<h1>양액 배합 계산기</h1>

<label>
양액만
<input type="checkbox" id="modeSwitch">
K+Mg
</label>

<!-- ================= 양액만 ================= -->
<div class="card" id="cardSimple">

<h2>양액만</h2>

<label>보정계수 (100mL + 100µL → EC 증가)</label>
<input id="coefS" type="number" step="0.01">

<label>용매 (mL)</label>
<input id="VsolventS" type="number">

<label>용질 (µL)</label>
<input id="VsoluteS" type="number">

<button onclick="calcSimple()">계산</button>

<div id="resultS"></div>

</div>

<!-- ================= K+Mg ================= -->
<div class="card hidden" id="cardK">

<h2>K+Mg 보정</h2>

<label>배합 용량 (L)</label>
<input id="Vbatch" type="number">

<label>목표 EC</label>
<input id="ECt" type="number">

<label>AB EC 증가 (0.5mL / 100mL)</label>
<input id="dAB" type="number">

<label>K 비율</label>
<input id="tK" type="number">

<label>N 비율</label>
<input id="tN" type="number" value="1">

<label>K stock (100µL → EC)</label>
<input id="dK" type="number">

<label>Mg stock (100µL → EC)</label>
<input id="dMg" type="number">

<label>K:Mg 비율</label>
<input id="KMg" type="number" value="4">

<button onclick="calcK()">계산</button>

<div id="resultK"></div>

</div>

<script>

// ===== 모드 토글 =====
modeSwitch.addEventListener("change",()=>{
  cardSimple.classList.toggle("hidden",modeSwitch.checked);
  cardK.classList.toggle("hidden",!modeSwitch.checked);
});


// ===== 양액만 =====
function calcSimple(){

  const coef = parseFloat(coefS.value);
  const solvent = parseFloat(VsolventS.value);
  const solute = parseFloat(VsoluteS.value);

  if(!coef || !solvent || !solute){
    resultS.innerHTML="입력 확인";
    return;
  }

  const EC = coef * (solute / solvent);

  resultS.innerHTML = `
  <table>
    <tr><th>예상 EC 증가</th><th>${EC.toFixed(3)}</th><th>mS/cm</th></tr>
  </table>`;
}



// ===== K+Mg =====
function calcK(){

  const V = parseFloat(Vbatch.value);
  const E = parseFloat(ECt.value);
  const dAB = parseFloat(dAB.value);
  const tk = parseFloat(tK.value);
  const tn = parseFloat(tN.value);
  const dK = parseFloat(dK.value);
  const dMg = parseFloat(dMg.value);
  const KMg = parseFloat(KMg.value);

  if(!V || !E || !dAB || !tk || !tn || !dK || !dMg){
    resultK.innerHTML="입력 확인";
    return;
  }

  const r = tk/tn;

  const aAB = dAB/5;
  let ab = (E*V)/aAB;

  let k=0, mg=0;

  for(let i=0;i<8;i++){

    k = ab * r * 0.1;

    if(r>1.5){
      mg = k / KMg;
    }else{
      mg = 0;
    }

    const ecK = (k/V)*(dK*10);
    const ecMg = (mg/V)*(dMg*10);

    const remain = E - (ecK+ecMg);

    ab = (remain*V)/aAB;
  }

  const A = ab/2;
  const B = ab/2;

  // ===== Ca ppm =====
  const Ca_ppm = 22500 * (ab / V);

  resultK.innerHTML = `
  <table>
    <tr><td>A액</td><td>${A.toFixed(2)} mL</td></tr>
    <tr><td>B액</td><td>${B.toFixed(2)} mL</td></tr>
    <tr><td>K stock</td><td>${k.toFixed(2)} mL</td></tr>
    <tr><td>Mg stock</td><td>${mg.toFixed(2)} mL</td></tr>
    <tr><td><b>Ca 농도</b></td><td><b>${Ca_ppm.toFixed(1)} ppm</b></td></tr>
  </table>`;
}

</script>

</body>
</html>
