<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>양액 계산기</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#007BFF">

<style>
/* === 기존 스타일 그대로 유지 === */
:root{--brand:#007BFF}
body{font-family:Arial;background:#f7f8fa;margin:0;padding:24px;text-align:center}
.wrap{max-width:760px;margin:auto}
.card{background:#fff;padding:20px;margin:16px auto;border-radius:14px}
input{width:100%;padding:12px;margin-top:6px}
.btn{margin-top:12px;padding:12px;width:100%;background:var(--brand);color:#fff;border:none;border-radius:10px}
.hidden{display:none}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border:1px solid #eee;padding:8px}
</style>
</head>

<body>

<h1>양액 배합 계산기</h1>

<div class="wrap">

<!-- ===== 양액만 ===== -->
<div class="card" id="cardSimple">
<h2>양액만</h2>

<div>
<label>보정계수 (100mL + 100µL → EC 증가)</label>
<input id="coefS" type="number" step="0.01">
</div>

<div>
<label>용매 (mL)</label>
<input id="VsolventS" type="number">
</div>

<div>
<label>용질 (µL)</label>
<input id="VsoluteS" type="number">
</div>

<button class="btn" onclick="calcSimple()">계산하기</button>

<div id="resultS"></div>
<div id="metaS"></div>
</div>


<!-- ===== K+Mg ===== -->
<div class="card" id="cardK">
<h2>K+Mg 보정 모드</h2>

<div>
<label>배합 용량 (L)</label>
<input id="Vbatch" type="number">
</div>

<div>
<label>목표 EC</label>
<input id="ECt" type="number">
</div>

<div>
<label>AB EC 증가</label>
<input id="dAB" type="number">
</div>

<div>
<label>K 비율</label>
<input id="tK" type="number">
</div>

<div>
<label>N 비율</label>
<input id="tN" type="number" value="1">
</div>

<div>
<label>K stock</label>
<input id="dK" type="number">
</div>

<div>
<label>Mg stock</label>
<input id="dMg" type="number">
</div>

<div>
<label>K:Mg</label>
<input id="KMgRatio" type="number" value="4">
</div>

<button class="btn" onclick="calcK()">계산하기</button>

<div id="result"></div>
<div id="meta"></div>

</div>

</div>

<script>

// ===== 유틸 =====
function getNum(id){
  const v=parseFloat(document.getElementById(id).value);
  return Number.isFinite(v)?v:NaN;
}

function setHTML(id,html){
  document.getElementById(id).innerHTML=html;
}

function setText(id,txt){
  document.getElementById(id).textContent=txt;
}


// ==========================
// 1️⃣ 양액만 (뒤집힌 로직)
// ==========================
function calcSimple(){

  const coef = getNum("coefS");
  const solvent = getNum("VsolventS");
  const solute = getNum("VsoluteS");

  setHTML("resultS","");
  setText("metaS","");

  if([coef,solvent,solute].some(x=>!Number.isFinite(x)||x<=0)){
    setHTML("resultS","입력 확인");
    return;
  }

  const EC = coef * (solute / solvent);

  setHTML("resultS",`
    <table>
      <tr><th>항목</th><th>값</th><th>단위</th></tr>
      <tr><td>예상 EC 증가</td><td>${EC.toFixed(3)}</td><td>mS/cm</td></tr>
    </table>
  `);

  setText("metaS",
`보정계수=${coef}
용매=${solvent}mL
용질=${solute}µL`);
}



// ==========================
// 2️⃣ K+Mg + Ca ppm 추가
// ==========================
function calcK(){

  const V=getNum("Vbatch");
  const E=getNum("ECt");
  const dAB=getNum("dAB");
  const tk=getNum("tK");
  const tn=getNum("tN");
  const dK=getNum("dK");
  const dMg=getNum("dMg");
  const KMg=getNum("KMgRatio");

  setHTML("result","");
  setText("meta","");

  if([V,E,dAB,tk,tn,dK,dMg].some(x=>!Number.isFinite(x)||x<=0)){
    setHTML("result","입력 확인");
    return;
  }

  const r=tk/tn;

  const aAB=dAB/5;
  let ab=(E*V)/aAB;

  let k=0, mg=0;

  for(let i=0;i<8;i++){

    k = ab * r * 0.1;

    if(r>1.5){
      mg = k / KMg;
    }else{
      mg = 0;
    }

    const ecK = (k/V)*(dK*10);
    const ecMg = (mg/V)*(dMg*10);

    const remain = E - (ecK+ecMg);

    ab = (remain*V)/aAB;
  }

  const A = ab/2;
  const B = ab/2;

  // ===== Ca ppm =====
  const Ca_ppm = 22500 * (ab / V);

  setHTML("result",`
    <table>
      <tr><td>A액</td><td>${A.toFixed(2)} mL</td></tr>
      <tr><td>B액</td><td>${B.toFixed(2)} mL</td></tr>
      <tr><td>K stock</td><td>${k.toFixed(2)} mL</td></tr>
      <tr><td>Mg stock</td><td>${mg.toFixed(2)} mL</td></tr>
      <tr><td><b>Ca</b></td><td><b>${Ca_ppm.toFixed(1)} ppm</b></td></tr>
    </table>
  `);

  setText("meta",
`총 EC=${E}
Ca=${Ca_ppm.toFixed(1)}ppm`);
}

</script>

</body>
</html>
