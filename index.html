<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>양액ㅛㅅ 계산기</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#007BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{ --brand:#007BFF; --brand-dark:#0056b3; --card-w: 760px; }
*{box-sizing:border-box}
body{ font-family: Arial, sans-serif; background:#f7f8fa; margin:0; padding:24px; text-align:center; }
h1{color:var(--brand); font-size:2.1rem; margin:0 0 12px}
.wrap{max-width:var(--card-w); margin:0 auto}

.card{ background:#fff; padding:20px; margin:16px auto; border-radius:14px;
box-shadow:0 6px 16px rgba(0,0,0,.06); text-align:left; font-size:1.06rem;}
.card h2{margin:0 0 10px; font-size:1.22rem; color:#222}

label{display:block; margin-top:12px; font-weight:700}
.row{display:flex; gap:12px; flex-wrap:wrap}
.row > div{flex:1 1 220px}

input{
  width:100%; padding:12px; margin-top:6px;
  border:1px solid #d7d7d7; border-radius:10px;
  font-size:1.05rem; background:#fff;
}

.btn{
  margin-top:16px; padding:13px 16px; width:100%;
  background:var(--brand); color:#fff; border:none; border-radius:10px;
  cursor:pointer; font-size:1.08rem;
}
.btn:hover{background:var(--brand-dark)}
.result{margin-top:14px; font-weight:700; color:#222; font-size:1.06rem}
.meta{font-size:.96rem; color:#333; white-space:pre-line; margin-top:10px}
.footer{font-size:.9rem; color:#666; margin-top:16px}
.hidden{display:none}

/* Toggle positioning */
.control-wrap{
  display:flex; justify-content:flex-end; align-items:center; gap:8px;
  margin: 0 auto 8px; max-width: var(--card-w); padding-right:10px;
}

/* Preset row */
.preset-wrap{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  margin: 0 auto 12px; max-width: var(--card-w); padding: 0 10px;
}
.preset-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.preset-btn{
  background:#fff; border:1px solid #e7e7e7; border-radius:999px;
  padding:10px 12px; cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.06);
  font-weight:700; color:#274690;
}
.preset-btn:hover{ background:#f5f8ff }
.preset-pill{
  font-size:.88rem; color:#274690; background:#eef6ff;
  padding:6px 10px; border-radius:999px; border:1px solid #d9e2ff;
}

/* Toggle box */
.float-box{
  display:flex; align-items:center; gap:8px;
  background:#ffffffd9; backdrop-filter:saturate(180%) blur(6px);
  border:1px solid #e7e7e7; border-radius:999px; padding:6px 10px;
  box-shadow:0 4px 10px rgba(0,0,0,.06);
}
.mode-chip{font-weight:700; color:#274690; background:#eef6ff; padding:4px 8px; border-radius:999px; font-size:.86rem}
.mode-chip.inactive{opacity:.55}

/* Small switch */
.switch{position:relative; display:inline-block; width:32px; height:16px}
.switch input{opacity:0; width:0; height:0}
.slider{ position:absolute; cursor:pointer; inset:0; background:#cfe2ff; transition:.2s; border-radius:999px}
.slider:before{
  position:absolute; content:""; height:12px; width:12px; left:2px; top:2px;
  background:#fff; transition:.2s; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.15)}
input:checked + .slider{background:#bcd0ff}
input:checked + .slider:before{transform:translateX(16px)}

/* Table */
table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:1.0rem}
th, td{ border:1px solid #eee; padding:10px 8px; text-align:right }
th{ background:#f3f6ff; color:#123}
td:first-child, th:first-child{ text-align:left }
td:last-child, th:last-child{ text-align:left }

/* Details */
details{margin-top:10px}
details > summary{
  cursor:pointer; user-select:none; padding:8px 10px;
  background:#f0f4ff; border:1px solid #d9e2ff;
  border-radius:10px; color:#274690; font-weight:700}
.details-body{padding:10px 2px; font-size:.98rem; color:#333; white-space:pre-line}

/* Modal */
.modal{
  position:fixed; inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center; justify-content:center;
  padding:18px; z-index:999;
}
.modal.open{ display:flex; }
.modal-card{
  width:min(560px, 100%);
  background:#fff; border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  padding:14px; text-align:left;
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 6px 10px; gap:10px; flex-wrap:wrap;
}
.modal-title{ font-weight:800; color:#123; font-size:1.08rem; }
.modal-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.modal-x{
  border:none; background:#f2f4f8; border-radius:10px;
  padding:8px 10px; cursor:pointer; font-weight:800;
}
.preset-list{ display:grid; gap:10px; padding:6px; }
.preset-item{
  border:1px solid #e7e7e7;
  border-radius:14px;
  padding:12px;
  cursor:pointer;
  background:#fff;
}
.preset-item:hover{ background:#f6f9ff }
.preset-name{ font-weight:900; color:#274690; margin-bottom:6px; }
.preset-sub{ font-size:.95rem; color:#333; white-space:pre-line; }

/* Preset lock gray + block input */
.locked input{
  background:#f1f3f8 !important;
  color:#555 !important;
  border:1px solid #dce1ec !important;
  pointer-events:none;
}

/* Mobile */
@media (max-width:480px){
  body{padding:14px}
  table{font-size:0.92rem}
  .preset-wrap{ padding:0 6px; }
}
</style>
</head>

<body>

<h1>양액 배합 계산기</h1>

<div class="control-wrap">
  <div class="float-box" title="모드 전환">
    <span id="chipSimple" class="mode-chip">양액만</span>
    <label class="switch"><input id="modeSwitch" type="checkbox"/><span class="slider"></span></label>
    <span id="chipK" class="mode-chip inactive">칼륨+Mg</span>
  </div>
  <div class="float-box" title="표시 단위 전환">
    <span class="mode-chip" id="unitLabelLeft">µL</span>
    <label class="switch"><input id="unitSwitch" type="checkbox"/><span class="slider"></span></label>
    <span class="mode-chip inactive" id="unitLabelRight">mL</span>
  </div>
</div>

<div class="preset-wrap">
  <div class="preset-left">
    <button class="preset-btn" id="btnPreset">프리셋 선택</button>
    <span class="preset-pill" id="presetNow">프리셋: 없음</span>
  </div>
  <button class="preset-btn" id="btnPresetClear" title="프리셋 잠금 해제">프리셋 해제</button>
</div>

<!-- Preset Modal -->
<div class="modal" id="presetModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="프리셋 선택">
    <div class="modal-head">
      <div class="modal-title">프리셋 선택 (설향 NFT)</div>
      <div class="modal-actions">
        <button class="preset-btn" id="btnPresetClearInModal">프리셋 해제</button>
        <button class="modal-x" id="presetClose">닫기</button>
      </div>
    </div>
    <div class="preset-list" id="presetList"></div>
  </div>
</div>

<div class="wrap">

  <!-- 양액만 -->
  <div class="card" id="cardSimple">
    <h2>양액만</h2>
    <div class="row">
      <div>
        <label for="VbatchS">배합 용량 (L)</label>
        <input type="number" id="VbatchS" step="0.1" min="0" placeholder="예: 2, 20">
      </div>
      <div>
        <label for="ECtS">목표 EC (mS/cm)</label>
        <input type="number" id="ECtS" step="0.01" min="0" placeholder="예: 1.20">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="dE_AB_1mLTotal_100mLS">AB(10wt%): 100 mL 물에 A 0.25 mL + B 0.25 mL(총 0.5 mL) → EC 증가 (mS/cm)</label>
        <input type="number" id="dE_AB_1mLTotal_100mLS" step="0.01" min="0" placeholder="예: 0.20">
      </div>
    </div>
    <button class="btn" id="btnCalcS">계산하기</button>
    <div class="result" id="resultS"></div>
    <div class="meta" id="metaS"></div>
  </div>

  <!-- 칼륨+Mg 자동 -->
  <div class="card hidden" id="cardK">
    <h2>칼륨+Mg / N:K&gt;1:1.5면 Mg 자동 (K:Mg=4:1)</h2>

    <div class="row">
      <div>
        <label for="Vbatch">배합 용량 (L)</label>
        <input type="number" id="Vbatch" step="0.1" min="0" placeholder="예: 2, 20">
      </div>
      <div>
        <label for="ECt">목표 EC (mS/cm)</label>
        <input type="number" id="ECt" step="0.01" min="0" placeholder="예: 1.20">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="dE_AB_1mLTotal_100mL">AB(10wt%): 100 mL 물에 A 0.25 mL + B 0.25 mL(총 0.5 mL) → EC 증가 (mS/cm)</label>
        <input type="number" id="dE_AB_1mLTotal_100mL" step="0.01" min="0" placeholder="예: 0.20">
      </div>
      <div>
        <label for="tK">목표 K</label>
        <input type="number" id="tK" step="0.01" min="0.0001" placeholder="예: 1.9">
      </div>
      <div>
        <label for="tN">목표 N</label>
        <input type="number" id="tN" step="0.01" min="0.0001" placeholder="예: 1">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="dE_Kstock_1mL_100mL">K₂SO₄: 100 mL 물에 0.5 g → EC 증가 (mS/cm)</label>
        <input type="number" id="dE_Kstock_1mL_100mL" step="0.01" min="0" value="8.50">
      </div>
      <div>
        <label for="dE_Mgstock_1mL_100mL">MgSO₄·7H₂O: 100 mL 물에 0.5 g → EC 증가 (mS/cm)</label>
        <input type="number" id="dE_Mgstock_1mL_100mL" step="0.01" min="0" value="5.00">
      </div>
      <div>
        <label for="KMgRatio">K:Mg 목표비 (질량비)</label>
        <input type="number" id="KMgRatio" step="0.1" min="0.1" value="4.0">
      </div>
    </div>

    <button class="btn" id="btnCalc">계산하기</button>
    <div class="result" id="result"></div>
    <div class="meta" id="meta"></div>

    <details>
      <summary>자세히</summary>
      <div class="details-body" id="debugBox"></div>
    </details>
  </div>

  <div class="footer" id="swStatus"></div>
</div>

<script>
"use strict";

/* ===== 안정 localStorage 래퍼 (사파리/인앱 예외 방지) ===== */
const SafeStorage = (() => {
  let mem = {};
  function ok(){
    try{
      const k="__t__"+Math.random();
      localStorage.setItem(k,"1");
      localStorage.removeItem(k);
      return true;
    }catch(e){ return false; }
  }
  const hasLS = ok();
  return {
    getItem(k){
      try{ return hasLS ? localStorage.getItem(k) : (k in mem ? mem[k] : null); }
      catch(e){ return (k in mem ? mem[k] : null); }
    },
    setItem(k,v){
      try{ if(hasLS) localStorage.setItem(k,v); else mem[k]=String(v); }
      catch(e){ mem[k]=String(v); }
    },
    removeItem(k){
      try{ if(hasLS) localStorage.removeItem(k); else delete mem[k]; }
      catch(e){ delete mem[k]; }
    }
  };
})();

/* ===== 상수 ===== */
const RHO_AB = 1.21;                  // g/mL
const SOLUTE_MASSFRAC_IN_10WT = 0.10;  // 10wt% 용액
const RHO_STOCK_DEFAULT = 1.00;        // 10wt% 용액 밀도 가정

const ATOMIC = { K:39.0983, Mg:24.305, S:32.065, O:15.999, H:1.008 };

// K2SO4
const M_K2SO4 = 2*ATOMIC.K + ATOMIC.S + 4*ATOMIC.O;
const MASSFRAC_K_IN_K2SO4 = (2*ATOMIC.K) / M_K2SO4;

// MgSO4·7H2O
const M_H2O = 2*ATOMIC.H + ATOMIC.O;
const M_MGSO4_7H2O = (ATOMIC.Mg + ATOMIC.S + 4*ATOMIC.O) + 7*M_H2O;
const MASSFRAC_MG_IN_MGSO4_7H2O = ATOMIC.Mg / M_MGSO4_7H2O;

/* ===== storage KEY ===== */
const KEY_SIMPLE="nutri_calc_simple_v11"; // 버전 올림(기준 변경)
const KEY_KMODE ="nutri_calc_kmode_v11";
const KEY_MODE  ="nutri_calc_mode_v10";
const KEY_UNIT  ="nutri_calc_unit_v10";
const KEY_PRESET="nutri_calc_preset_v10";

/* ===== 프리셋 ===== */
const PRESETS = [
  { id:"transplant", name:"정식기(정식~활착)", ec:(0.7+0.9)/2, nk:1.0,
    note:"목적: 뿌리 확장\nEC 0.7~0.9 → 0.80\nN:K 1:1" },
  { id:"veg", name:"생육기", ec:(1.0+1.2)/2, nk:1.2,
    note:"목적: 잎·관부 성장\nEC 1.0~1.2 → 1.10\nN:K 1:1.2" },
  { id:"flower", name:"개화기(개화~착과)", ec:(1.2+1.3)/2, nk:1.5,
    note:"목적: 꽃·초기 과실\nEC 1.2~1.3 → 1.25\nN:K 1:1.5" },
  { id:"bulk", name:"비대기", ec:(1.3+1.45)/2, nk:(1.8+2.0)/2,
    note:"목적: 크기·당도\nEC 1.3~1.45 → 1.38\nN:K 1:1.8~2 → 1:1.9" },
];

/* ===== DOM 유틸(절대 throw하지 않기) ===== */
function $(id){ return document.getElementById(id); }
const getNum = id => {
  const el = $(id);
  if(!el) return NaN;
  const v = parseFloat(el.value);
  return Number.isFinite(v) ? v : NaN;
};
const round1 = x => Math.round(x*10)/10;
const setHTML = (id,html)=>{ const el=$(id); if(el) el.innerHTML = html; };
const setText = (id,txt)=>{ const el=$(id); if(el) el.textContent = txt; };

function showFatal(err){
  const el = $("swStatus");
  if(el){
    el.style.color = "#b00020";
    el.style.whiteSpace = "pre-line";
    el.textContent = "오류로 인해 스크립트가 중단됨:\n" + String(err && err.message ? err.message : err);
  }
  console.error(err);
}

/* ===== 상태 ===== */
function hasPreset(){ return !!SafeStorage.getItem(KEY_PRESET); }
function isKMode(){ return !!JSON.parse(SafeStorage.getItem(KEY_MODE)||"false"); }
function isUnitML(){ return !!JSON.parse(SafeStorage.getItem(KEY_UNIT)||"false"); }

/* ===== UI ===== */
function applyModeUI(isK){
  $("cardSimple")?.classList.toggle("hidden",isK);
  $("cardK")?.classList.toggle("hidden",!isK);
  if($("modeSwitch")) $("modeSwitch").checked=isK;
  $("chipSimple")?.classList.toggle("inactive",isK);
  $("chipK")?.classList.toggle("inactive",!isK);
  SafeStorage.setItem(KEY_MODE,JSON.stringify(isK));
}
function applyUnitUI(isML){
  if($("unitSwitch")) $("unitSwitch").checked=isML;
  $("unitLabelLeft")?.classList.toggle("inactive",isML);
  $("unitLabelRight")?.classList.toggle("inactive",!isML);
  SafeStorage.setItem(KEY_UNIT,JSON.stringify(isML));
}

/* ===== 저장/로드 ===== */
function loadSimple(){
  let d=null;
  try{ d=JSON.parse(SafeStorage.getItem(KEY_SIMPLE)||"null"); }catch(e){ d=null; }
  if(!d) return;
  for(const k in d){
    const el = $(k);
    if(el) el.value = d[k];
  }
}
function saveSimple(){
  const d={ VbatchS:getNum("VbatchS"), ECtS:getNum("ECtS"), dE_AB_1mLTotal_100mLS:getNum("dE_AB_1mLTotal_100mLS") };
  SafeStorage.setItem(KEY_SIMPLE,JSON.stringify(d));
}
function loadK(){
  let d=null;
  try{ d=JSON.parse(SafeStorage.getItem(KEY_KMODE)||"null"); }catch(e){ d=null; }
  if(!d) return;
  for(const k in d){
    const el = $(k);
    if(el) el.value = d[k];
  }
}
function saveK(){
  const d={
    Vbatch:getNum("Vbatch"), ECt:getNum("ECt"),
    dE_AB_1mLTotal_100mL:getNum("dE_AB_1mLTotal_100mL"),
    tK:getNum("tK"), tN:getNum("tN"),
    dE_Kstock_1mL_100mL:getNum("dE_Kstock_1mL_100mL"),
    dE_Mgstock_1mL_100mL:getNum("dE_Mgstock_1mL_100mL"),
    KMgRatio:getNum("KMgRatio")
  };
  SafeStorage.setItem(KEY_KMODE,JSON.stringify(d));
}

/* ===== 단위 처리(표시용) ===== */
function unitName(){ return isUnitML()? "mL":"µL"; }
function toUnit(v_uL){ return isUnitML()? round1(v_uL/1000): Number(v_uL.toFixed(1)); }
function cellVol(v_uL){ return toUnit(v_uL).toFixed(1); }

/* ===== 결과 표 (K모드) ===== */
function tableK(vA_uL, vB_uL, kStock_mL, mgStock_mL){
  const kDisp  = isUnitML() ? kStock_mL.toFixed(2)  : (kStock_mL*1000).toFixed(1);
  const mgDisp = isUnitML() ? mgStock_mL.toFixed(2) : (mgStock_mL*1000).toFixed(1);
  const u = unitName();
  const uStock = isUnitML() ? "mL" : "µL";

  return `
  <table>
    <thead><tr><th>항목</th><th>값</th><th>단위</th></tr></thead>
    <tbody>
      <tr><td>A액(10wt%)</td><td>${cellVol(vA_uL)}</td><td>${u}</td></tr>
      <tr><td>B액(10wt%)</td><td>${cellVol(vB_uL)}</td><td>${u}</td></tr>
      <tr><td>K₂SO₄ 10wt% 용액</td><td>${kDisp}</td><td>${uStock}</td></tr>
      <tr><td>MgSO₄·7H₂O 10wt% 용액</td><td>${mgDisp}</td><td>${uStock}</td></tr>
    </tbody>
  </table>`;
}

/* ===== 계산(양액만) ===== */
function calcSimple(){
  const V=getNum("VbatchS"), E=getNum("ECtS"), dAB=getNum("dE_AB_1mLTotal_100mLS");
  setHTML("resultS",""); setText("metaS","");

  if([V,E,dAB].some(x=>!Number.isFinite(x)||x<0)){ setHTML("resultS","입력 확인");return; }
  if(V===0){ setHTML("resultS","부피 0 불가");return; }
  if(dAB===0){ setHTML("resultS","AB EC증분 0 불가");return; }

  // 기준 변경:
  // dAB = "100 mL 물에 AB 총 0.5 mL" 일 때 EC 증가
  // => 0.5 mL / 0.1 L = 5 mL/L
  const aAB = dAB / 5;          // EC per (mL/L)
  const vAB_mL = (E * V) / aAB; // AB 총량 (mL) (A+B 합)
  const vA_uL = (vAB_mL/2) * 1000;
  const vB_uL = (vAB_mL/2) * 1000;

  setHTML("resultS",`
    <table>
      <thead><tr><th>항목</th><th>값</th><th>단위</th></tr></thead>
      <tbody>
        <tr><td>A액(10wt%)</td><td>${cellVol(vA_uL)}</td><td>${unitName()}</td></tr>
        <tr><td>B액(10wt%)</td><td>${cellVol(vB_uL)}</td><td>${unitName()}</td></tr>
      </tbody>
    </table>
  `);
  saveSimple();
}

/* ===== 계산(칼륨+Mg 자동) ===== */
function calcK(){
  const V=getNum("Vbatch"), E=getNum("ECt"),
        dAB=getNum("dE_AB_1mLTotal_100mL"),
        tk=getNum("tK"), tn=getNum("tN"),
        dK_0p5g=getNum("dE_Kstock_1mL_100mL"),
        dMg_0p5g=getNum("dE_Mgstock_1mL_100mL"),
        kMgRatio=getNum("KMgRatio");

  setHTML("result",""); setText("meta",""); setText("debugBox","");

  if([V,E,dAB,tk,tn,dK_0p5g,dMg_0p5g,kMgRatio].some(x=>!Number.isFinite(x)||x<0)){
    setHTML("result","입력 확인");return;
  }
  if(V===0){ setHTML("result","부피 0 불가");return; }
  if(tn<=0){ setHTML("result","tN 0 불가");return; }
  if(kMgRatio<=0){ setHTML("result","K:Mg 비율 0 불가");return; }
  if(dAB===0 || dK_0p5g===0 || dMg_0p5g===0){ setHTML("result","EC증분 0 불가");return; }

  const r = tk/tn;

  // ===== EC 환산 계수(기준 변경) =====
  // AB: 0.5 mL / 100 mL = 5 mL/L
  const aAB = dAB / 5;          // EC per (mL/L)  (AB 총량)

  // K2SO4: 0.5 g / 100 mL = 5 g/L
  const aK_gL  = dK_0p5g / 5;   // EC per (g/L) (K2SO4)
  const aMg_gL = dMg_0p5g / 5;  // EC per (g/L) (MgSO4·7H2O)

  // ===== 기존 네 K-비례식 유지 =====
  const kElem_g_per_uL_AB = Math.max(0, RHO_AB*(0.0575*r - 0.0425) / 1000);
  const k2so4_g_per_uL_AB = kElem_g_per_uL_AB / MASSFRAC_K_IN_K2SO4;

  const doMg = (r > 1.5);
  const mgElem_g_per_uL_AB = doMg ? (kElem_g_per_uL_AB / kMgRatio) : 0;
  const mgso4_7h2o_g_per_uL_AB  = doMg ? (mgElem_g_per_uL_AB / MASSFRAC_MG_IN_MGSO4_7H2O) : 0;

  // 출력은 기존대로 10wt% 용액 mL로 환산(투입 방식 유지)
  const kStock_mL_per_uL_AB  = k2so4_g_per_uL_AB / (RHO_STOCK_DEFAULT * SOLUTE_MASSFRAC_IN_10WT);
  const mgStock_mL_per_uL_AB = mgso4_7h2o_g_per_uL_AB / (RHO_STOCK_DEFAULT * SOLUTE_MASSFRAC_IN_10WT);

  // ===== 목표 EC 식 =====
  // AB농도(mL/L) = (vAB_uL/1000) / V
  // K농도(g/L)   = (k2so4_g_per_uL_AB * vAB_uL) / V
  // Mg농도(g/L)  = (mgso4_7h2o_g_per_uL_AB * vAB_uL) / V
  //
  // E = aAB*(vAB_uL/1000)/V + aK_gL*(k2so4_g_per_uL_AB*vAB_uL)/V + aMg_gL*(mgso4_g_per_uL_AB*vAB_uL)/V
  //   = [ aAB/1000 + aK_gL*k2so4_g_per_uL_AB + aMg_gL*mgso4_g_per_uL_AB ] * (vAB_uL / V)
  const denom = (aAB/1000) + (aK_gL*k2so4_g_per_uL_AB) + (aMg_gL*mgso4_7h2o_g_per_uL_AB);
  if(denom <= 0){ setHTML("result","계산 불가(분모 0)"); return; }

  const vAB_uL = (E * V) / denom; // AB 총량(µL)
  const vA_uL = vAB_uL/2, vB_uL = vAB_uL/2;

  const kStock_mL  = kStock_mL_per_uL_AB  * vAB_uL;
  const mgStock_mL = mgStock_mL_per_uL_AB * vAB_uL;

  setHTML("result", tableK(vA_uL, vB_uL, kStock_mL, mgStock_mL));
  saveK();

  setText("debugBox",
`r=tK/tN = ${r.toFixed(4)} (Mg auto: ${doMg})
aAB(0.5mL/100mL)=${aAB.toFixed(6)}  [mS per (mL/L)]
aK(0.5g/100mL)=${aK_gL.toFixed(6)} [mS per (g/L)]
aMg(0.5g/100mL)=${aMg_gL.toFixed(6)} [mS per (g/L)]
denom=${denom.toExponential(6)}
vAB=${vAB_uL.toFixed(2)} µL
K stock=${kStock_mL.toFixed(4)} mL
Mg stock=${mgStock_mL.toFixed(4)} mL`);
}

/* ===== 프리셋 잠금 ===== */
function lockByPreset(locked){
  const ids = ["ECt","dE_AB_1mLTotal_100mL","tK","tN","dE_Kstock_1mL_100mL","dE_Mgstock_1mL_100mL","KMgRatio"];
  ids.forEach(id=>{
    const el = $(id);
    if(!el) return;
    const box = el.parentElement;
    if(locked){
      el.setAttribute("readonly","true");
      el.setAttribute("tabindex","-1");
      if(box) box.classList.add("locked");
    }else{
      el.removeAttribute("readonly");
      el.removeAttribute("tabindex");
      if(box) box.classList.remove("locked");
    }
  });
}

/* ===== 프리셋 UI ===== */
function openPreset(){ $("presetModal")?.classList.add("open"); $("presetModal")?.setAttribute("aria-hidden","false"); }
function closePreset(){ $("presetModal")?.classList.remove("open"); $("presetModal")?.setAttribute("aria-hidden","true"); }
function presetLabel(p){ return `프리셋: ${p ? p.name : "없음"}`; }

function renderPresetList(){
  const wrap = $("presetList");
  if(!wrap) return;
  wrap.innerHTML = "";
  for(const p of PRESETS){
    const div = document.createElement("div");
    div.className = "preset-item";
    div.innerHTML = `<div class="preset-name">${p.name}</div><div class="preset-sub">${p.note}</div>`;
    div.addEventListener("click", ()=>applyPreset(p.id));
    wrap.appendChild(div);
  }
}
function loadPresetUI(){
  const id = SafeStorage.getItem(KEY_PRESET);
  const p = PRESETS.find(x=>x.id===id) || null;
  if($("presetNow")) $("presetNow").textContent = presetLabel(p);
  lockByPreset(!!id);
  if(!!id && !isKMode()) applyModeUI(true);
}
function clearPreset(){
  SafeStorage.removeItem(KEY_PRESET);
  if($("presetNow")) $("presetNow").textContent = presetLabel(null);
  lockByPreset(false);
}
function applyPreset(presetId){
  const p = PRESETS.find(x=>x.id===presetId);
  if(!p) return;

  if(!isKMode()) applyModeUI(true);

  if($("ECt")) $("ECt").value = p.ec.toFixed(2);
  if($("tN"))  $("tN").value  = "1";
  if($("tK"))  $("tK").value  = p.nk.toFixed(2);
  if($("KMgRatio")) $("KMgRatio").value = "4.0";

  // NOTE: K/Mg EC증분 값은 사용자 실측 기준(0.5g/100mL)이라 여기선 자동 기본값 강제 안 함
  SafeStorage.setItem(KEY_PRESET, presetId);
  if($("presetNow")) $("presetNow").textContent = presetLabel(p);
  lockByPreset(true);
  closePreset();
  saveK();
  calcK();
}

/* ===== 서비스워커(https/localhost에서만) ===== */
async function tryRegisterSW(){
  const el = $("swStatus");
  const proto = location.protocol;
  const isLocalhost = (location.hostname === "localhost" || location.hostname === "127.0.0.1");
  const ok = (proto === "https:" || isLocalhost);

  if(!("serviceWorker" in navigator)){
    if(el) el.textContent = "PWA: Service Worker 미지원";
    return;
  }
  if(!ok){
    if(el) el.textContent = "PWA: file://에서는 SW 비활성 (서버로 열어야 함)";
    return;
  }
  try{
    const reg = await navigator.serviceWorker.register("./service-worker.js", { scope: "./" });
    if(el) el.textContent = "PWA: 서비스워커 등록됨";
    reg.addEventListener("updatefound", ()=>{ if(el) el.textContent = "PWA: 업데이트 감지(새로고침하면 적용)"; });
  }catch(e){
    if(el) el.textContent = "PWA: 서비스워커 등록 실패(경로/서버 확인)";
  }
}

/* ===== 초기화 ===== */
document.addEventListener("DOMContentLoaded", ()=>{
  try{
    // UI 상태
    applyModeUI(isKMode());
    applyUnitUI(isUnitML());

    // 값 로드
    loadSimple();
    loadK();

    // 프리셋
    renderPresetList();
    loadPresetUI();

    // 버튼 이벤트
    $("btnCalcS")?.addEventListener("click",calcSimple);
    $("btnCalc")?.addEventListener("click",calcK);

    // 저장 이벤트
    ["VbatchS","ECtS","dE_AB_1mLTotal_100mLS"].forEach(id=> $(id)?.addEventListener("change",saveSimple));
    ["Vbatch","ECt","dE_AB_1mLTotal_100mL","tK","tN","dE_Kstock_1mL_100mL","dE_Mgstock_1mL_100mL","KMgRatio"]
      .forEach(id=> $(id)?.addEventListener("change",saveK));

    // 모드/단위
    $("modeSwitch")?.addEventListener("change", e=>{
      if(hasPreset() && !e.target.checked){
        e.target.checked = true;
        applyModeUI(true);
        return;
      }
      applyModeUI(e.target.checked);
    });
    $("chipSimple")?.addEventListener("click", ()=>{
      if(hasPreset()){ applyModeUI(true); return; }
      applyModeUI(false);
    });
    $("chipK")?.addEventListener("click", ()=>applyModeUI(true));

    $("unitSwitch")?.addEventListener("change", e=>applyUnitUI(e.target.checked));

    // 프리셋 모달
    $("btnPreset")?.addEventListener("click", openPreset);
    $("presetClose")?.addEventListener("click", closePreset);
    $("presetModal")?.addEventListener("click", (e)=>{ if(e.target === $("presetModal")) closePreset(); });
    $("btnPresetClear")?.addEventListener("click", clearPreset);
    $("btnPresetClearInModal")?.addEventListener("click", ()=>{ clearPreset(); closePreset(); });

    // 프리셋 있으면 K모드 강제 + 계산
    if(hasPreset()){
      applyModeUI(true);
      lockByPreset(true);
      calcK();
    }

    // SW
    tryRegisterSW();
  }catch(err){
    showFatal(err);
  }
});
</script>
